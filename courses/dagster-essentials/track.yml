title: Dagster Essentials
teaser: Learn the fundamentals of Dagster. Build an asset-centric data pipeline with
  dependencies, resources, schedules, partitions, and sensors.
description: |-
  Learn the basics of Dagster, the asset-centric orchestration platform. In this track, you'll build a real data pipeline around NYC taxi data - defining software-defined assets, wiring up dependencies, sharing connections with resources, and automating everything with jobs, schedules, partitions, and sensors.

  By the end, you'll have a complete, production-shaped Dagster project and the mental model to build your own: think in assets, not tasks.

  Adapted from the Dagster University "Dagster Essentials" course.
